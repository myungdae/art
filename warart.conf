<VirtualHost *:80>
        ServerAdmin myungdae.cho@gmail.com
        ServerName warart.eventpool.kr
        ServerAlias warart.eventpool.kr

        DocumentRoot /home/ubuntu/sight
        <Directory />
                Options -Indexes +FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>

        ProxyRequests Off
        ProxyPreserveHost On
        ProxyVia Full
        <Proxy *>
                Require all granted
        </Proxy>

        <Location />
                ProxyPass http://localhost:8603/
                ProxyPassReverse http://localhost:8603/
        </Location>
</VirtualHost>
